<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="version" content="0.0.6">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBC Trip Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#1d1d1f;--mute:#8a8a8e;--line:#e6e6e8;--acc:#1f6feb;--danger:#d1242f;--org:#f07d00;--org2:#ffe2bf;--org2ink:#9a4a00;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 0;overflow:hidden}
.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{flex:none}
.brand small{color:var(--mute);font-size:11px}
.tabs{display:flex;border:1px solid var(--ink);flex:none}
.tabs button{border:none;padding:6px 8px;font-weight:600;width:96px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#planBtn{width:184px;flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--org);font-weight:600;padding:6px 10px;background:#fff}
#planBtn #planName{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#planBtn .car{color:var(--org);flex:none}
#planBtn.open{background:var(--org);color:#fff}#planBtn.open .car{color:#fff}
.menu.pdd{width:260px;padding:4px}
.prow{display:flex;align-items:stretch}
.prow .pn{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.on .pn,.prow.on .pm{background:var(--org);color:#fff;font-weight:600}
.prow .pm{width:34px!important;flex:none;text-align:center;color:var(--mute)}
.pdd hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.tabs button.on{background:var(--ink);color:#fff}
.tabs.lang{border-color:var(--line)}.tabs.lang button{padding:5px 4px;font-weight:500;font-size:12.5px;width:60px}
.gtools{display:flex;gap:6px;flex:none}
.gtools button{width:96px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 6px}
.gtools button.ic1{width:34px;font-size:15px;padding:3px 0}
.gtools button.ghost{width:72px}
.gtools button:disabled{opacity:.35;cursor:default}
#app{display:flex;flex:1;min-height:0}
#app[hidden],#calv[hidden]{display:none}
#panel{width:400px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#map{flex:1;min-width:0;background:#e9e9e9}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 0 6px;font-weight:700}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px}
button:hover{background:#f3f3f5}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{border:none;background:none;padding:2px 6px;color:var(--mute)}
button.ghost:hover{background:#f0f0f2;color:var(--ink)}
#days{flex:1;overflow:auto;padding:4px 0 40px;-webkit-overflow-scrolling:touch}
.day{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.day.dim{opacity:.45}
.dh{display:flex;align-items:center;gap:10px}
.chk{width:22px;height:22px;border-radius:5px;border:2px solid var(--c);background:var(--c);flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.chk svg{width:14px;height:14px}
.chk.off{background:#fff}.chk.off svg{display:none}
.dt{flex:1;min-width:0;cursor:pointer}
.dt .t{font-weight:700;font-size:15px}
.dt .t small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px}
.dt .p{font-size:12.5px;color:#444}
.dd{font-size:11.5px;color:var(--mute);text-align:right;white-space:nowrap}
.day.focus{background:#f6f8fb}
.note{font-size:12px;color:#6b6b70;margin:6px 0 0 32px;white-space:pre-wrap}
ul.stops{list-style:none;margin:6px 0 0;padding:0 0 0 32px}
.leg{font-size:11.5px;color:var(--mute);padding:2px 0 2px 2px;display:flex;align-items:center;gap:5px}
.leg svg{width:13px;height:13px;flex:none}
.leg.est{font-style:italic}
.leg.chip{display:inline-flex;background:var(--org2);color:var(--org2ink);font-weight:600;padding:2px 7px;margin:3px 0}
.leg.chip:empty{display:none}
.dd.chip b{background:var(--org);color:#fff!important;padding:1px 6px;display:inline-block}
.ll{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:max-content;background:var(--org);color:#fff;font:700 11px/1 var(--font);padding:3px 6px;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap;pointer-events:none}
.ll.pale{background:var(--org2);color:var(--org2ink)}
.bs.tg{margin-top:6px}
.st{display:flex;align-items:flex-start;gap:8px;padding:4px 0;position:relative}
.ic{width:20px;height:20px;flex:none;margin-top:1px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.sb{flex:1;min-width:0}
.sn{font-size:14px;cursor:pointer;word-break:break-word}
.sn:hover{text-decoration:underline}
.sm{font-size:11.5px;color:var(--mute)}
.sm a{color:var(--acc);text-decoration:none}
.sm .warn{color:#b26b00}
.alt{font-size:11.5px;color:var(--mute);margin-top:2px}
.alt button{font-size:11px;padding:0 6px;border-radius:5px;margin-left:4px}
.menu{position:absolute;right:0;top:26px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:160px}
.menu button{display:block;width:100%;text-align:left;border:none;border-radius:6px;padding:7px 10px}
.menu button.del{color:var(--danger)}
.add{margin:6px 0 0 32px;font-size:12.5px;color:var(--mute);border-style:dashed}
/* markers */
.mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:max-content;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--font);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-h{padding:0 6px;height:24px;min-width:24px;white-space:nowrap}
.mk-s{border-radius:50%;width:14px;height:14px}
.mk-a{border-radius:50%;width:22px;height:22px;background:#1d1d1f!important}
.mk.sel{outline:3px solid rgba(31,111,235,.55)}
.leaflet-tooltip{font:12px var(--font)}
.leaflet-popup-content{font:13px/1.45 var(--font);margin:10px 12px}
.leaflet-popup-content a{color:var(--acc)}
/* base switch */
.bs{background:#fff;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.25);display:flex;overflow:hidden}
.bs button{border:none;border-radius:0;padding:6px 4px;font-size:12px;width:72px;text-align:center;white-space:nowrap}
.bs button.on{background:var(--ink);color:#fff}
/* banner + modal */
#banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:1000;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;display:none;gap:10px;align-items:center;max-width:calc(100% - 32px)}
#banner button{background:#fff;color:var(--ink);border:none;padding:3px 10px;border-radius:999px}
#modal{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:18px}
#modal h3{margin:0 0 12px;font-size:16px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.f textarea{min-height:54px;resize:vertical}
.row{display:flex;gap:8px}.row>.f{flex:1}
.loc{display:flex;gap:6px}.loc input{flex:1}
#sres{margin-top:4px;border:1px solid var(--line);border-radius:8px;max-height:160px;overflow:auto;display:none}
#sres div{padding:6px 9px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
#sres div:hover{background:#f3f3f5}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.coord{font-size:11.5px;color:var(--mute);margin-top:4px}
input[type=file]{display:none}
/* ---------- calendar (sheet) mode ---------- */
#calv{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
.ctool{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);flex:none}
.ctool input{font:inherit;padding:4px 6px;border:1px solid var(--line)}
.ctool .stats{display:inline-flex}
#cal{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;width:max-content;font-size:12.5px}
.grid>div{border-bottom:1px solid rgba(0,0,0,.07);border-right:1px solid rgba(0,0,0,.07);padding:7px 8px;min-width:0}
.rl{position:sticky;left:0;z-index:3;background:#fff;color:var(--mute);font-size:12px;line-height:1.25}
.rl small{font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.c{background:var(--pz)}
.r-h{position:sticky;top:0;z-index:2;border-top:4px solid var(--c,#ccc)!important;background:var(--pz)}
.rl.r-h{z-index:4;background:#fff;border-top-color:#fff!important}
.c.tot{background:#f4f4f5}.c.tot.r-h{background:#f4f4f5}
.ch{display:flex;align-items:flex-start;gap:4px}
.ch .cd{flex:1}.ch .cd b{font-size:14px}.ch .cd span{color:#555;margin-left:4px}
.ch .dn{font-size:11px;color:var(--c);font-weight:700;letter-spacing:.05em}
.ed{outline:none;min-height:1.4em;padding:2px 3px;margin:-2px -3px;cursor:text;white-space:pre-wrap;word-break:break-word}
.ed:hover{background:rgba(255,255,255,.6)}
.ed:focus{background:#fff;box-shadow:0 0 0 2px var(--acc)}
.ed:empty::before{content:attr(data-ph);color:rgba(0,0,0,.3)}
.r-plan .ed{font-weight:600}
.cs{display:flex;flex-direction:column;gap:5px;min-height:28px}
.ci,.hc{background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.08);padding:5px 6px;display:flex;gap:6px;align-items:flex-start}
.ci{cursor:grab}.ci:active{cursor:grabbing}
.ci .ic,.hc .ic{width:16px;height:16px;margin-top:1px}.ci .ic svg,.hc .ic svg{width:15px;height:15px}
.cn{cursor:pointer;word-break:break-word}.cn:hover{text-decoration:underline}
.cn b{font-variant-numeric:tabular-nums;margin-right:3px}
.ci .leg,.hc .leg{padding:1px 0 0;font-size:11px}
.ci .leg.chip,.hc .leg.chip{padding:1px 5px;margin:3px 0 0}
.hc{flex-direction:column;gap:2px}
.hrow{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.hrow>*{white-space:nowrap}.hrow .ed{white-space:nowrap}
.hrow button.ghost{padding:0 4px;font-size:11px}
.hrow .ed{color:var(--ink);min-width:3em}
.hrow a{color:var(--acc);text-decoration:none}
.ghost-ci{opacity:.35}
.grid .add{margin:6px 0 0;padding:3px 8px;font-size:11.5px;background:rgba(255,255,255,.5)}
.grid .dd{text-align:left}
.grid>.r-slot{border-bottom:1px dashed rgba(0,0,0,.12)}
.grid>.r-slot .cs{min-height:46px}
.grid>.rl.r-pm,.grid>.c.r-pm{border-bottom:1px solid rgba(0,0,0,.07)}
.rl.r-slot{font-weight:600;color:#555}
.grid .alt{margin-top:3px}
@media print{
  #top .gtools,#top .tabs,#app,.ctool .hint,.grid .add,.grid button.ghost{display:none!important}
  #calv{display:flex!important}#shell{height:auto}#cal{overflow:visible}
  .rl,.r-h{position:static}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A3 landscape;margin:8mm}
}
#map:focus,#map:focus-visible{outline:none}
@media (max-width:1180px){
  #top{flex-wrap:wrap;row-gap:8px}
  .brand{order:-1;flex:1 0 100%}
  .gtools button{width:84px}.gtools button.ghost{width:64px}
  .tabs.lang{margin-left:auto}
}
@media (max-width:760px){
  .gtools{flex:1 1 0;min-width:0;overflow-x:auto;order:4}
  #planBtn{order:1}.tabs[role=tablist]{order:2}
  .gtools button{flex:none;font-size:12.5px;width:84px}
  .tabs.lang{order:3;margin-left:0}
  .tabs button{width:76px}#planBtn{width:140px}.tabs.lang button{width:50px}
  #top{gap:8px;padding:8px 10px}
  .ctool{gap:8px;padding:6px 10px}.ctool .hint{display:none}
  #app{flex-direction:column}
  #map{flex:none;height:52vh;height:52dvh;order:1}
  #panel{width:100%;flex:1;order:2;border-right:none;border-top:1px solid var(--line)}
  header{padding:10px 16px 8px}
  .menu{right:0}
}
</style>
</head>
<body>
<div id="shell">
<nav id="top">
  <button id="planBtn" class="pbtn" data-act="plandd" aria-haspopup="listbox"><span id="planName"></span><span class="car">▾</span></button>
  <div class="tabs" role="tablist"><button data-tab="map" role="tab" data-i18n="tabMap">Map</button><button data-tab="cal" role="tab" data-i18n="tabCal">Calendar</button></div>
  <div class="brand"><b id="ttl"></b><small id="ver">v0.0.6</small></div>
  <div class="gtools">
    <button id="bUndo" class="ic1" data-i18n-title="undo">↶</button>
    <button id="bRedo" class="ic1" data-i18n-title="redo">↷</button>
    <button id="bExp" data-i18n="export">Export .zip</button>
    <button id="bImp" data-i18n="import">Import</button>
    <button id="bPrint" data-i18n="print">Print</button>
    <button id="bReset" class="ghost" data-i18n="reset">Reset</button>
    <input type="file" id="fImp" accept=".json,application/json">
  </div>
  <div class="tabs lang" id="langSw"><button data-lang="en">EN</button><button data-lang="ja">日本語</button><button data-lang="zh">中文</button></div>
</nav>
<div id="app">
  <aside id="panel">
    <header>
      <div class="stats" id="stats"></div>
      <div class="tools">
        <button id="bAll" data-i18n="showAll">Show all</button>
        <button id="bRe" data-i18n="recalc">Recalc routes</button>
      </div>
    </header>
    <div id="days"></div>
  </aside>
  <div id="map"></div>
</div>
<section id="calv" hidden>
  <div class="ctool">
    <label><span data-i18n="tripStart">Trip start</span> <input type="date" id="cStart"></label>
    <span class="stats" id="stats2"></span>
    <span class="hint" data-i18n="hint"></span>
  </div>
  <div id="cal"></div>
</section>
</div>
<div id="banner"><span id="bTxt"></span><button id="bCancel" data-i18n="cancel">Cancel</button></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script id="planData" type="application/json">null</script>
<script>
'use strict';
const APP_VERSION='0.0.6';
const SRC_HTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML; // pristine copy for ZIP export
/* ============ DEFAULT PLAN (from 麗山職業玩家第一雪團 - 06JAN26.csv) ============ */

const SBC_LOC=[36.8600,138.3900];

  st(H,'SBC',SBC_LOC[0],SBC_LOC[1],{approx:true,alts:[{name:'桐屋旅館（HAN）',price:null,link:'',lat:36.9196,lng:138.4475,approx:true}]})]},
{date:'16 Jan',dow:'Sat',plan:'野澤',note:'HAN：桐屋旅館',stops:[

    alts:[{name:'桐屋旅館（HAN）',price:null,link:'',lat:36.9196,lng:138.4475,approx:true}]})]},
{date:'17 Jan',dow:'Sun',plan:'野澤 → 諏訪湖',note:'',stops:[

{date:'20 Jan',dow:'Wed',plan:'箱根 → 成田',note:'',stops:[

/* ============ ROUTING (OSRM public demo, fallback = straight-line estimate) ============ */
function dayPoints(di){
  const d=plan.days[di],pts=[],ids=[];
  // start from previous day's last overnight hotel
  for(let k=di-1;k>=0;k--){const h=[...plan.days[k].stops].reverse().find(s=>s.type===H);if(h){pts.push(h);ids.push(null);break;}if(plan.days[k].stops.length){const l=plan.days[k].stops[plan.days[k].stops.length-1];pts.push(l);ids.push(null);break;}}
  d.stops.forEach(s=>{if(!isFinite(s.lat)||!isFinite(s.lng))return;if(pts.length&&same(pts[pts.length-1],s))return;pts.push(s);ids.push(s.id);});
  return{pts,ids};}
function simplify(c,max){if(c.length<=max)return c;const step=c.length/max,o=[];for(let i=0;i<c.length;i+=step)o.push(c[Math.floor(i)]);o.push(c[c.length-1]);return o;}
async function fetchRoute(pts){
  const key=pts.map(p=>(+p.lng).toFixed(5)+','+(+p.lat).toFixed(5)).join(';');
  if(routeCache[key])return routeCache[key];
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+key+'?overview=full&geometries=geojson',{signal:ctl.signal});
    clearTimeout(to);const j=await r.json();if(j.code!=='Ok'||!j.routes||!j.routes[0])throw new Error(j.code);
    const rt=j.routes[0];
    const res={src:'osrm',coords:simplify(rt.geometry.coordinates.map(c=>[+c[1].toFixed(5),+c[0].toFixed(5)]),1500),legs:rt.legs.map(l=>({d:l.distance,t:l.duration}))};
    routeCache[key]=res;lsSet(LS_ROUTE,JSON.stringify(routeCache));return res;
  }catch(e){
    const legs=[];for(let i=1;i<pts.length;i++){const dd=hav(pts[i-1],pts[i])*1.35;legs.push({d:dd,t:dd/(55/3.6)});}
    return{src:'est',coords:pts.map(p=>[p.lat,p.lng]),legs};}
}
let routeGen=0;
async function computeRoutes(){
  const gen=++routeGen;
  for(let i=0;i<plan.days.length;i++){
    const d=plan.days[i],{pts,ids}=dayPoints(i);
    if(pts.length<2){routes[d.id]={src:'none',coords:[],legs:[],legStop:[]};}
    else{const r=await fetchRoute(pts);if(gen!==routeGen)return;routes[d.id]=Object.assign({},r,{legStop:ids.slice(1)});}
    drawRoutes();updateLegUI();
  }
}

function drawRoutes(){

    const lbl=(ll,txt,cls)=>L.marker(ll,{pane:'lbl',interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,0],html:`<div class="ll${cls}">${txt}</div>`})}).addTo(lblLayer);
    const ap=r.src==='est'?'≈ ':'';
    if(lblMode==='day'&&!dim){const tot=r.legs.reduce((a,l)=>a+l.t,0),pts=dayPoints(i).pts,m=legMids(r.coords,[pts[0],pts[pts.length-1]])[0];
      if(tot>=120&&m)lbl(m,`D${i+1} · ${ap}${fmtT(tot)}`,'');}
    if(lblMode==='all'&&!dim){const mids=legMids(r.coords,dayPoints(i).pts);
      r.legs.forEach((l,k)=>{if(l.t>=120&&mids[k])lbl(mids[k],ap+fmtT(l.t),' pale');});}
  });}
// split route geometry at each waypoint, return the distance-midpoint of every leg
function legMids(c,pts){
  if(!c.length||pts.length<2)return[];
  const near=(p,from)=>{let b=from,bd=1e18;for(let j=from;j<c.length;j++){const dy=c[j][0]-p.lat,dx=c[j][1]-p.lng,dd=dy*dy+dx*dx;if(dd<bd){bd=dd;b=j;}}return b;};
  const idx=[0];for(let k=1;k<pts.length;k++)idx.push(k===pts.length-1?c.length-1:near(pts[k],idx[k-1]));
  const dist=(a,b)=>hav({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]});
  return idx.slice(1).map((e,k)=>{const s=idx[k];if(e<=s)return c[s];let tot=0;for(let j=s;j<e;j++)tot+=dist(c[j],c[j+1]);
    let acc=0;for(let j=s;j<e;j++){const d=dist(c[j],c[j+1]);if(acc+d>=tot/2){const f=d?(tot/2-acc)/d:0;return[c[j][0]+(c[j+1][0]-c[j][0])*f,c[j][1]+(c[j+1][1]-c[j][1])*f];}acc+=d;}return c[e];});}
function drawMarkers(){

  const groups=new Map();
  plan.days.forEach((d,di)=>d.stops.forEach((s,si)=>{
    if(!isFinite(s.lat)||!isFinite(s.lng))return;
    const key=s.type===H?'H|'+s.name+'|'+(+s.lat).toFixed(5)+'|'+(+s.lng).toFixed(5):'S|'+s.id;
    if(!groups.has(key))groups.set(key,{s,items:[]});groups.get(key).items.push({d,di,s,si});}));
  groups.forEach(({s,items})=>{
    const vis=items.filter(it=>it.d.show);if(!vis.length)return;
    const dim=focusDay&&!vis.some(it=>it.d.id===focusDay);
    const first=(focusDay&&vis.find(it=>it.d.id===focusDay))||vis[0];
    const col=dayColor(first.di);let html,size,anchor;

    m.bindTooltip(esc(s.name),{direction:'top',offset:[0,-10]});

function updateLegUI(){

    if(!r){pending++;els.forEach(el=>el.innerHTML='<span>…</span>');return;}

      document.querySelectorAll(`[data-leg="${sid}"]`).forEach(le=>{le.className='leg'+(r.src==='est'?' est':'')+(lblMode==='all'?' chip':'');le.innerHTML=`${ICON.car}${r.src==='est'?'≈ ':''}${fmtT(l.t)} · ${fmtD(l.d)}`;});});

    els.forEach(el=>{el.classList.toggle('chip',lblMode!=='off');el.innerHTML=tm?`<b style="color:var(--ink)">${r.src==='est'?'≈ ':''}${fmtT(tm)}</b><br>${fmtD(dist)}`:t('noDrive');});

      l?Math.round(l.t/60):'',l?(l.d/1000).toFixed(1):'',(s.alts||[]).map(a=>a.name+(a.price?' '+a.price:'')+(a.link?' '+a.link:'')).join(' | ')]);});});
  return '\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n');}
const xe=v=>String(v==null?'':v).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
function stopDesc(s){return [s.time,s.price!=null&&s.price!==''?money(s.price):'',s.note,s.link].filter(Boolean).join(' · ');}
// KML — import into Google My Maps / Google Earth (one folder per day: pins + route)
function planKML(){
  const kc=i=>{const c=document.createElement('canvas').getContext('2d');c.fillStyle=dayColor(i);const h=c.fillStyle.replace('#','');return 'ff'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2);};
  let k=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xe(tripTitle())}</name>`;
  plan.days.forEach((d,i)=>{k+=`<Style id="d${i}"><LineStyle><color>${kc(i)}</color><width>4</width></LineStyle></Style><Folder><name>DAY ${i+1} ${xe(d.date)} ${xe(d.plan)}</name>`;
    d.stops.forEach(s=>{k+=`<Placemark><name>${xe(s.name)}</name><description>${xe(stopDesc(s))}</description><Point><coordinates>${s.lng},${s.lat},0</coordinates></Point></Placemark>`;});
    const r=routes[d.id];if(r&&r.coords.length>1)k+=`<Placemark><name>DAY ${i+1} route</name><styleUrl>#d${i}</styleUrl><LineString><tessellate>1</tessellate><coordinates>${r.coords.map(c=>c[1]+','+c[0]+',0').join(' ')}</coordinates></LineString></Placemark>`;
    k+='</Folder>';});
  return k+'</Document></kml>';}
// GPX — for navigation / outdoor apps
function planGPX(){
  let g=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="13STUDIO Trip Planner" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${xe(tripTitle())}</name></metadata>`;
  plan.days.forEach((d,i)=>d.stops.forEach(s=>{g+=`<wpt lat="${s.lat}" lon="${s.lng}"><name>D${i+1} ${xe(s.name)}</name><desc>${xe(stopDesc(s))}</desc><type>${xe(s.type)}</type></wpt>`;}));
  plan.days.forEach((d,i)=>{const r=routes[d.id];if(r&&r.coords.length>1)g+=`<trk><name>DAY ${i+1} ${xe(d.plan)}</name><trkseg>${r.coords.map(c=>`<trkpt lat="${c[0]}" lon="${c[1]}"/>`).join('')}</trkseg></trk>`;});
  return g+'</gpx>';}
// ICS — one all-day event per day, for Google / Apple / Outlook calendars
function planICS(){
  const ie=v=>String(v==null?'':v).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const o=[];let x=l;while(x.length>70){o.push(x.slice(0,70));x=' '+x.slice(70);}o.push(x);return o.join('\r\n');};
  const ymd=dt=>isoD(dt).replace(/-/g,''),now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//13STUDIO//Trip Planner//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:'+ie(tripTitle())];
  plan.days.forEach((d,i)=>{const dt=dayDate(i);if(!dt)return;const h=[...d.stops].reverse().find(s=>s.type===H),r=routes[d.id];
    const drive=r&&r.legs.length?fmtT(r.legs.reduce((a,l)=>a+l.t,0)):'';
    const desc=[d.note,...d.stops.map(s=>(s.time?s.time+' ':'')+s.name+(s.type===H&&s.link?' '+s.link:'')),drive?'Drive '+drive:''].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT','UID:'+d.id+'@sbc-trip','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+ymd(dt),'DTEND;VALUE=DATE:'+ymd(new Date(dt.getTime()+864e5)),
      fold('SUMMARY:'+ie('DAY '+(i+1)+' · '+(d.plan||''))),fold('DESCRIPTION:'+ie(desc)));
    if(h)L.push(fold('LOCATION:'+ie(h.name)),'GEO:'+h.lat+';'+h.lng);L.push('END:VEVENT');});
  L.push('END:VCALENDAR');return L.join('\r\n');}
function exportZip(){
  const json=JSON.stringify(plan,null,1);
  plans[activeId]=plan; // the exported HTML carries every plan
  const html=SRC_HTML.replace(/(<script id="planData" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify({active:activeId,order:planOrder,plans}).replace(/<\//g,'<\\/')+b);
  const base='SBC_TRIP_'+stamp(),pn='SBC_TRIP_'+planLabel(plan).replace(/[\\/:*?"<>|\s]+/g,'_');
  const files=[[base+'/SBC_TRIP_MAP.html',html],[base+'/'+pn+'.json',json],[base+'/'+pn+'.csv',planCSV()],
    [base+'/'+pn+'.kml',planKML()],[base+'/'+pn+'.gpx',planGPX()]];
  if(plan.start)files.push([base+'/'+pn+'.ics',planICS()]);
  const blob=makeZip(files);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
// minimal ZIP writer (STORE, UTF-8 names)
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),d=new Date(),parts=[],cen=[];let off=0;
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(([name,text])=>{const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(h,nb,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);
    c.setUint32(42,off,true);cen.push(c,nb);off+=30+nb.length+data.length;});
  const csz=cen.reduce((a,x)=>a+(x.byteLength),0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/zip'});}
document.getElementById('bImp').onclick=()=>document.getElementById('fImp').click();
document.getElementById('fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const p=JSON.parse(rd.result);if(!Array.isArray(p.days))throw 0;plan=normalize(p);focusDay=null;commit();fitAll();}catch(err){alert(t('invalidFile'));}};rd.readAsText(f);e.target.value='';};

/* ============ CALENDAR (sheet) MODE ============ */
const calEl=document.getElementById('cal');
const ROWS=[['h',''],['plan','rowPlan'],['am','am'],['noon','noon'],['pm','pm'],['stay','rowStay'],['note','rowNote'],['drive','rowDrive'],['cost','rowCost']];
const dayById=id=>plan.days.find(d=>d.id===id);
const nightHotel=d=>[...d.stops].reverse().find(s=>s.type===H);
function calCell(k,d,i){
  const c=dayColor(i);
  if(k==='h'){const dd=dispDate(i,d);return `<div class="ch"><div class="cd"><b>${esc(dd[0])}</b><span>${esc(dd[1])}</span><div class="dn">${t('dayU',i+1)}</div></div>
    <button class="ghost" data-act="daymenu" data-day="${d.id}" aria-label="${t('dayOpts')}">⋯</button></div>`;}
  if(k==='plan')return `<div class="ed" contenteditable="true" spellcheck="false" data-f="plan" data-day="${d.id}" data-ph="${t('planPh')}">${esc(d.plan)}</div>`;
  if(k==='note')return `<div class="ed" contenteditable="true" spellcheck="false" data-f="note" data-day="${d.id}" data-ph="${t('notePh')}">${esc(d.note)}</div>`;
  if(SLOTS.includes(k))return `<div class="cs" data-day="${d.id}" data-slot="${k}">${d.stops.filter(s=>s.type!==H&&slotOf(s)===k).map(s=>`<div class="ci" data-id="${s.id}">
      <span class="ic" style="color:${s.type===A?'#1d1d1f':c}">${ICON[s.type]||ICON.spot}</span>
      <div class="sb"><div class="cn" data-act="sedit" data-id="${s.id}">${s.time?`<b>${esc(s.time)}</b>`:''}${esc(s.name)}</div>
      ${s.note?`<div class="sm">${esc(s.note)}</div>`:''}<div class="leg" data-leg="${s.id}"></div></div></div>`).join('')}</div>
    <button class="add" data-act="add" data-day="${d.id}" data-slot="${k}">${t('plusPin')}</button>`;
  if(k==='stay'){const hs=d.stops.filter(s=>s.type===H);
    if(!hs.length)return `<button class="add" data-act="addhotel" data-day="${d.id}">${t('addHotel')}</button>`;
    return hs.map(s=>`<div class="hc"><div class="leg" data-leg="${s.id}"></div>
      <div style="display:flex;gap:6px;align-items:flex-start"><span class="ic" style="color:${c}">${ICON.hotel}</span>
        <div class="ed" style="flex:1" contenteditable="true" spellcheck="false" data-f="hname" data-id="${s.id}" data-ph="${t('hotelPh')}">${esc(s.name)}</div>
        <button class="ghost" data-act="sedit" data-id="${s.id}" aria-label="${t('editDetails')}">⋯</button></div>
      <div class="hrow">$<div class="ed" contenteditable="true" data-f="hprice" data-id="${s.id}" data-ph="${t('pricePh')}">${s.price==null?'':esc(s.price)}</div>
        ${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">${t('link')}</a>`:''}<button class="ghost" data-act="link" data-id="${s.id}">${t(s.link?'replLink':'plink')}</button></div>
      ${s.approx?`<div class="sm"><span class="warn">${t('approxLoc')}</span></div>`:''}
      ${(s.alts||[]).map((a,ai)=>`<div class="alt">${t('alt')}: ${esc(a.name)} ${money(a.price)} <button data-act="swap" data-id="${s.id}" data-ai="${ai}">${t('use')}</button></div>`).join('')}</div>`).join('');}
  if(k==='drive')return `<div class="dd" data-daytotal="${d.id}"></div>`;
  if(k==='cost'){const h=nightHotel(d);return h&&h.price?money(h.price):'<span style="color:rgba(0,0,0,.3)">—</span>';}
  return '';}
function totCell(k){
  if(k==='h')return `<div class="cd"><b>${t('total')}</b></div>`;
  if(k==='drive')return '<div class="dd" data-tot="drive"></div>';
  if(k==='cost')return '<b>'+money(plan.days.reduce((a,d)=>{const h=nightHotel(d);return a+(h&&h.price?+h.price:0)},0))+'</b>';
  return '';}
function renderCal(){
  if(!calEl)return;
  const cols=`72px repeat(${plan.days.length},${innerWidth<=760?168:188}px) 128px`;
  let h=`<div class="grid" style="grid-template-columns:${cols}">`;
  ROWS.forEach(([k,lab])=>{h+=`<div class="rl r-${k}${SLOTS.includes(k)?' r-slot':''}">${lab?t(lab):''}</div>`;
    plan.days.forEach((d,i)=>{h+=`<div class="c r-${k}${SLOTS.includes(k)?' r-slot':''}" style="--pz:${dayPastel(i)};--c:${dayColor(i)}">${calCell(k,d,i)}</div>`;});
    h+=`<div class="c tot r-${k}">${totCell(k)}</div>`;});
  calEl.innerHTML=h+'</div>';
  const cs=document.getElementById('cStart');if(cs&&document.activeElement!==cs)cs.value=plan.start||'';
  initSortable();updateLegUI();}
let sortables=[];
function initSortable(){
  sortables.forEach(x=>x.destroy());sortables=[];if(!window.Sortable)return;
  calEl.querySelectorAll('.cs').forEach(el=>sortables.push(Sortable.create(el,{group:'stops',animation:150,draggable:'.ci',
    delay:180,delayOnTouchOnly:true,ghostClass:'ghost-ci',onEnd:syncFromCal})));}
function syncFromCal(){ // DOM order of stop cards -> plan (hotels stay at the end of their own day)
  const all={};plan.days.forEach(d=>d.stops.forEach(s=>all[s.id]=s));
  const next=plan.days.map(d=>SLOTS.flatMap(k=>{const el=calEl.querySelector(`.cs[data-day="${d.id}"][data-slot="${k}"]`);
      if(!el)return d.stops.filter(s=>s.type!==H&&slotOf(s)===k);
      return [...el.querySelectorAll('.ci')].map(x=>all[x.dataset.id]).filter(Boolean).map(s=>{s.slot=k;return s;});})
    .concat(d.stops.filter(s=>s.type===H)));
  plan.days.forEach((d,i)=>d.stops=next[i]);commit();}
calEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;if(act!=='daymenu')closeMenu();
  const day=b.dataset.day&&dayById(b.dataset.day);
  if(act==='daymenu')dayMenu(day,b);
  else if(act==='add')openEditor(null,day,b.dataset.slot?{type:S,name:'',lat:null,lng:null,time:'',note:'',link:'',price:null,slot:b.dataset.slot}:undefined);
  else if(act==='addhotel')openEditor(null,day,{type:H,name:'',lat:null,lng:null,time:'',note:'',link:'',price:null});
  else if(act==='sedit'){const f=findStop(b.dataset.id);if(f)openEditor(f.s,f.d);}
  else if(act==='link'){const f=findStop(b.dataset.id);if(f)openLinkEditor(f.s);}
  else if(act==='swap')swapAlt(b.dataset.id,+b.dataset.ai);});
calEl.addEventListener('keydown',e=>{const t=e.target.closest('.ed');if(!t)return;
  if(e.key==='Enter'&&(t.dataset.f!=='note'||!e.shiftKey)&&t.dataset.f!=='note'){e.preventDefault();t.blur();}
  else if(e.key==='Escape'){t.dataset.cancel='1';t.blur();}});
calEl.addEventListener('paste',e=>{const t=e.target.closest('.ed');if(!t)return;e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,txt);});
calEl.addEventListener('focusout',e=>{
  const t=e.target.closest('.ed');if(!t)return;const f=t.dataset.f;
  const rt=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.ed');
  const refocus=rt?`.ed[data-f="${rt.dataset.f}"]`+(rt.dataset.day?`[data-day="${rt.dataset.day}"]`:`[data-id="${rt.dataset.id}"]`):null;
  if(t.dataset.cancel){delete t.dataset.cancel;renderCal();return;}
  const v=t.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'').trim();let changed=false;
  if(f==='plan'||f==='note'){const d=dayById(t.dataset.day);if(d&&d[f]!==v){d[f]=v;changed=true;}}
  else{const fs=findStop(t.dataset.id);if(!fs)return;const s=fs.s;
    if(f==='hname'){if(v&&v!==s.name){siblings(s).forEach(x=>x.name=v);s.name=v;changed=true;}}
    else if(f==='hprice'){const n=v===''?null:parseFloat(v.replace(/[^\d.]/g,''));const nv=n==null||isNaN(n)?null:n;if(nv!==(s.price==null||s.price===''?null:+s.price)){s.price=nv;changed=true;}}}
  if(!changed)return;
  save();render();renderCal();
  if(refocus){const el=calEl.querySelector(refocus);if(el){el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}}});
document.getElementById('cStart').addEventListener('change',e=>{if(!e.target.value)return;plan.start=e.target.value;commit();});
